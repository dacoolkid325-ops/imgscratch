<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to Scratch Tool</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #4f46e5;
      --accent-hover: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-item {
      margin-bottom: 1.2rem;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    #scaleDisplay {
      color: var(--text);
      font-weight: bold;
    }

    input[type="file"], select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      width: 100%;
      outline: none;
      font-size: 0.9rem;
    }

    input[type="file"]::file-selector-button {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      margin-right: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    input[type="file"]::file-selector-button:hover {
      background: var(--accent-hover);
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    .preview-container {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem;
      border-radius: 12px;
      border: 1px dashed var(--card-border);
    }

    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }

    .canvas-wrapper {
      position: relative;
      border-radius: 4px;
      border: 1px solid var(--card-border);
      max-width: 100%;
      max-height: 200px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      image-rendering: pixelated;
      display: block;
      max-width: 100%;
      max-height: 200px;
      object-fit: contain; 
    }

    .stats {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .stats span {
      color: var(--text);
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #38bdf8;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      padding: 0.8rem;
      resize: vertical;
      outline: none;
      word-break: break-all;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    button:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
 

<div class="container">
  <h1>Image to Scratch</h1>
  <p class="subtitle">Convert an image for Scratch. Max size is 480x360.</p>

  <div class="form-item">
    <label for="imageInput">Choose Image</label>
    <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
  </div>

  <div class="form-item">
    <label for="scaleSlider">
      <span>Set Scale</span>
      <span id="scaleDisplay">10%</span>
    </label>
    <input type="range" id="scaleSlider" min="1" max="100" value="10">
  </div>

  <div class="form-item">
    <label for="alphaMode">Transparent Areas</label>
    <select id="alphaMode">
      <option value="000000">Solid Black (000000)</option>
      <option value="FFFFFF">Solid White (FFFFFF)</option>
            <option value="CHECKERBOARD">Classic Checkerboard</option>
    </select>
  </div>

  <div class="preview-container">
    <div class="preview-box">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="previewCanvas"></canvas>
      </div>
      <div class="stats">Final Size: <span id="finalSize">0x0</span></div>
    </div>
  </div>

  <div class="form-item">
    <label for="outputText">Output List</label>
    <textarea id="outputText" readonly placeholder="Upload an image..."></textarea>
  </div>

  <button id="copyBtn">Copy Text</button>
</div>

<script>
  const imageInput = document.getElementById('imageInput');
  const scaleSlider = document.getElementById('scaleSlider');
  const scaleDisplay = document.getElementById('scaleDisplay');
  const alphaMode = document.getElementById('alphaMode');
  const canvas = document.getElementById('previewCanvas');
  const canvasWrapper = document.getElementById('canvasWrapper');
  
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const outputText = document.getElementById('outputText');
  const finalSize = document.getElementById('finalSize');
  const copyBtn = document.getElementById('copyBtn');

  const MAX_W = 480;
  const MAX_H = 360;

  let currentImage = null;
  let originalWidth = 0;
  let originalHeight = 0;

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      currentImage = img;
      originalWidth = img.width;
      originalHeight = img.height;
      processImage();
    };
    img.src = URL.createObjectURL(file);
  });

  scaleSlider.addEventListener('input', () => {
    scaleDisplay.textContent = `${scaleSlider.value}%`;
    if (currentImage) processImage();
  });

  alphaMode.addEventListener('change', () => {
    updateCanvasBackground();
    if (currentImage) processImage();
  });

  function updateCanvasBackground() {
    if (alphaMode.value === "CHECKERBOARD") {
      canvasWrapper.style.background = "repeating-conic-gradient(#E0E0E0 0% 25%, #FFFFFF 0% 50%) 50% / 16px 16px";
    } else if (alphaMode.value === "FFFFFF") {
      canvasWrapper.style.background = "#FFFFFF";
    } else if (alphaMode.value === "000000") {
      canvasWrapper.style.background = "#000000";
    }
  }

  function processImage() {
    if (!currentImage) return;

    const ratio = originalWidth / originalHeight;
    const scaleFactor = parseInt(scaleSlider.value) / 100;
    
    let w = originalWidth * scaleFactor;
    let h = originalHeight * scaleFactor;
    
    if (w > MAX_W) {
        w = MAX_W;
        h = w / ratio;
    }
    if (h > MAX_H) {
        h = MAX_H;
        w = h * ratio;
    }
    
    w = Math.max(1, Math.round(w));
    h = Math.max(1, Math.round(h));

    canvas.width = w;
    canvas.height = h;

    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(currentImage, 0, 0, w, h);

    const imgData = ctx.getImageData(0, 0, w, h).data;
    const colorList = [];
    const checkerSize = 4;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        let r = imgData[i];
        let g = imgData[i + 1];
        let b = imgData[i + 2];
        const a = imgData[i + 3] / 255; // Normalize alpha to 0 - 1

        let finalR, finalG, finalB;

        if (a < 0.5) {
          // Transparent replacement
          if (alphaMode.value === "CHECKERBOARD") {
            const isWhite = (Math.floor(x / checkerSize) + Math.floor(y / checkerSize)) % 2 === 0;
            finalR = isWhite ? 255 : 224;
            finalG = isWhite ? 255 : 224;
            finalB = isWhite ? 255 : 224;
            colorList.push(isWhite ? "FFFFFF" : "E0E0E0");
          } else if (alphaMode.value === "FFFFFF") {
            finalR = 255; finalG = 255; finalB = 255;
            colorList.push("FFFFFF");
          } else {
            finalR = 0; finalG = 0; finalB = 0;
            colorList.push("000000");
          }
        } else {
          // Fully blend semi-transparent or opaque colors against the chosen choice so they don't look desaturated/washed out
          let bgR = 255, bgG = 255, bgB = 255;
          if (alphaMode.value === "000000") {
            bgR = 0; bgG = 0; bgB = 0;
          } else if (alphaMode.value === "CHECKERBOARD") {
            const isWhite = (Math.floor(x / checkerSize) + Math.floor(y / checkerSize)) % 2 === 0;
            bgR = isWhite ? 255 : 224;
            bgG = isWhite ? 255 : 224;
            bgB = isWhite ? 255 : 224;
          }

          finalR = Math.round(r * a + bgR * (1 - a));
          finalG = Math.round(g * a + bgG * (1 - a));
          finalB = Math.round(b * a + bgB * (1 - a));

          const hex = ((1 << 24) + (finalR << 16) + (finalG << 8) + finalB)
            .toString(16)
            .slice(1)
            .toUpperCase();
          colorList.push(hex);
        }

        // Update preview buffer directly with the fully saturated blend
        imgData[i] = finalR;
        imgData[i + 1] = finalG;
        imgData[i + 2] = finalB;
        imgData[i + 3] = 255;
      }
    }

    const modifiedImgData = new ImageData(imgData, w, h);
    ctx.putImageData(modifiedImgData, 0, 0);

    outputText.value = `${w},${h},${colorList.join(',')}`;
    finalSize.textContent = `${w}x${h}px`;
  }

  copyBtn.addEventListener('click', () => {
    if (!outputText.value) return;
    navigator.clipboard.writeText(outputText.value);
    const origText = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = origText, 1500);
  });

  updateCanvasBackground();
</script>

</body>
</html>
